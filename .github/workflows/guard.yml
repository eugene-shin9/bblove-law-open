name: Guard (tests and public-content check)
on:
  push:
  pull_request:
permissions: {}
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the YAML parser the workflow-contract tests use (pinned)
        run: python -m pip install --disable-pip-version-check -q PyYAML==6.0.3
      - name: Offline tests (no credentials)
        run: python -I -m unittest discover -s tests
      - name: Path allowlist and personal-data patterns
        run: python -I scripts/repo_guard.py
