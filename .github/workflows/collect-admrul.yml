name: Collect administrative rules (law.go.kr DRF)
on:
  workflow_dispatch:
  schedule:
    # 매주 화요일 02:40 KST (월요일 17:40 UTC)
    - cron: '40 17 * * 1'
permissions: {}
concurrency:
  group: law-go-kr-drf
  cancel-in-progress: false
  # 기본값은 대기 1건뿐이라 새 실행이 대기 중인 실행을 취소한다(11/9 월요일 법령 수집이 수동 실행에 밀려 취소됨).
  # queue: max는 대기열(최대 100)에 차례로 쌓아 순서대로 실행한다. 동시에 1건만 도는 제한은 그대로다.
  queue: max
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the YAML parser the workflow-contract tests use (pinned)
        run: python -m pip install --disable-pip-version-check -q PyYAML==6.0.3
      - name: Offline tests and public-content guard before using credentials
        run: |
          python -I -m unittest discover -s tests
          python -I scripts/repo_guard.py
      - name: Check the credential is configured (value is never printed)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          if [ -z "$LAW_OC" ]; then
            echo "::error title=LAW_OC missing::Repository Actions secret LAW_OC is not available to this workflow"
            exit 1
          fi
          echo "::notice title=LAW_OC::configured"
      - name: Restore resumable checkpoint
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: auto/admrul
          key: admrul-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            admrul-v1-
      - name: Choose law.go.kr egress and check it answers (fails fast when blocked)
        id: egress
        uses: ./.github/actions/law-egress
        with:
          client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          exit-node: ${{ secrets.TS_EXIT_NODE }}
      - name: Collect administrative rules (bounded; partial resumes next run)
        id: collect
        timeout-minutes: 60
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          # Only this step goes through the exit node; empty means direct.
          HTTPS_PROXY: ${{ steps.egress.outputs.https-proxy }}
        run: python src/bblove_admrul.py collect --out auto/admrul --seconds 3300 --partial-ok
      - name: Credential scan before caching or uploading anything
        id: scan_raw
        if: always()
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py auto/admrul
      - name: Save checkpoint (only after a clean scan)
        if: always() && steps.scan_raw.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: auto/admrul
          key: admrul-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and verify assets, package with release-info
        if: steps.collect.outputs.complete == 'true'
        run: |
          python src/bblove_admrul.py build --out auto/admrul --dest admrul-assets
          python src/bblove_admrul.py verify --dest admrul-assets
          mkdir -p release
          (cd admrul-assets && zip -q -r ../release/admrul_assets.zip admrul)
          (cd auto && zip -q -r ../release/admrul-raw.zip admrul)
          cp auto/admrul/manifest.json release/admrul-manifest.json
          cp auto/admrul/collection-failures.json release/admrul-failures.json 2>/dev/null || echo '[]' > release/admrul-failures.json
          python -I scripts/release_info.py --release release --manifest auto/admrul/manifest.json --kind admrul
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Credential scan of the release payload
        if: steps.collect.outputs.complete == 'true'
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py release admrul-assets auto/admrul
      - name: Build provenance attestation
        if: steps.collect.outputs.complete == 'true'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - name: Publish an immutable release (draft until every file is uploaded)
        if: steps.collect.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="admrul-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          # 건수만 적는다(제목은 manifest와 실행 요약에서 본다).
          pending=$(python3 -I - <<'PY'
          import json
          m = json.load(open('auto/admrul/manifest.json', encoding='utf-8'))
          e = [x for x in m.get('excluded', []) if x.get('reason') == 'NOT_YET_EFFECTIVE']
          paired = sum(x.get('current_edition_listed') is True for x in e)
          print(f"시행 전 제외 {len(e)}건(현행판 함께 수집 {paired}건, 옛 판 빠짐 {sum(x.get('previous_edition_dropped') is True for x in e)}건).")
          PY
          )
          gh release create "$tag" --draft --target "$GITHUB_SHA" --latest=false \
            --title "행정규칙 수집본 $(date -u +%Y-%m-%d)" \
            --notes "law.go.kr DRF 행정규칙 수집·검증본. ${pending} release-info.json·SHA256SUMS·attestation으로 검증."
          gh release upload "$tag" release/*
          gh release edit "$tag" --draft=false --latest=false
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the newest 6 admrul releases
        if: steps.collect.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt,isDraft \
            --jq '[.[] | select(.tagName | startswith("admrul-")) | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' |
          while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
      - name: Progress (annotation; nothing is committed)
        if: always()
        run: |
          python3 - <<'PY'
          import json, collections, os, pathlib, re
          p = pathlib.Path('auto/admrul/manifest.json')
          m = json.loads(p.read_text()) if p.exists() else {}
          docs = m.get('documents', [])
          st = dict(collections.Counter(d.get('status') for d in docs))
          a = pathlib.Path('auto/admrul/attempt.json')
          att = json.loads(a.read_text()) if a.exists() else {}
          # 예상 밖 오류는 예외 종류·발생 위치(파일:함수:줄)만 보인다. 메시지·응답 본문·URL은 기록되지 않는다.
          safe = lambda v: v if isinstance(v, str) and re.fullmatch(r'[A-Za-z0-9_.:<>]{1,160}', v) else None
          error = f" exception={safe(att.get('exception'))} where={safe(att.get('where'))} admrul_where={safe(att.get('admrul_where'))}" if att.get('exception') else ''
          # 중복 ID 실패: 종류·개수·같은 부처/제목 집계(숫자)만. ID·제목은 기록되지 않는다.
          count = lambda v: v if type(v) is int and 0 <= v < 10**6 else None
          kinds = att.get('duplicate_kind') if isinstance(att.get('duplicate_kind'), list) else []
          detail = att.get('duplicate_detail') if isinstance(att.get('duplicate_detail'), dict) else {}
          by_kind = ','.join(f"{safe(k)}:{count((detail.get(k) or {}).get('ids'))}/{count((detail.get(k) or {}).get('same_org'))}/{count((detail.get(k) or {}).get('same_title'))}" for k in kinds[:6] if isinstance(k, str))
          if kinds or 'duplicate_ids' in att:
              error += f" duplicate_ids={count(att.get('duplicate_ids'))} duplicate_kind(ids/same_org/same_title)={by_kind}"
          # 시행 전이라 뺀 규칙: 건수·옛 판 빠짐 건수·현행연혁구분 값·제목(공개 법령 정보)만. 본문·URL은 없다.
          pend = [e for e in m.get('excluded', []) if isinstance(e, dict) and e.get('reason') == 'NOT_YET_EFFECTIVE']
          dropped = sum(e.get('previous_edition_dropped') is True for e in pend)
          paired = sum(e.get('current_edition_listed') is True for e in pend)
          word = lambda v, n: re.sub(r'[\x00-\x1f\x7f`|<>\[\]]', ' ', v)[:n].strip() if isinstance(v, str) else ''
          hist = sorted({word(e.get('history_class'), 20) for e in pend})
          titles = [f"{word(e.get('title'), 120)} (시행 {word(e.get('effective'), 8)}{', 현행판 함께 수집' if e.get('current_edition_listed') is True else ''}{', 옛 판 빠짐' if e.get('previous_edition_dropped') is True else ''})" for e in pend[:30]]
          line = f"date={m.get('date')} status={m.get('status')} docs={len(docs)} counts={st} attempt={att.get('status')}/{att.get('reason')}{error} org_observed={json.dumps(m.get('org_observed'), ensure_ascii=False)} excluded={len(m.get('excluded', []))} not_yet_effective={len(pend)} current_edition_listed={paired} previous_edition_dropped={dropped} history_class={json.dumps(hist, ensure_ascii=False)}"
          # 범위: 부처별 문서 수와 제외 사유별 건수(숫자·부처명·사유 코드만).
          org = lambda v: v if isinstance(v, str) and re.fullmatch(r'[가-힣]{2,20}', v) else '기타'
          code = lambda v: v if isinstance(v, str) and re.fullmatch(r'[A-Z_]{1,40}', v) else 'OTHER'
          scope = m.get('scope') if isinstance(m.get('scope'), str) and re.fullmatch(r'[a-z0-9+-]{1,40}', m.get('scope')) else None
          by_org = dict(sorted(collections.Counter(org(d['row'].get('소관부처명') if isinstance(d.get('row'), dict) else None) for d in docs if isinstance(d, dict)).items()))
          by_reason = dict(sorted(collections.Counter(code(e.get('reason')) for e in m.get('excluded', []) if isinstance(e, dict)).items()))
          scope_line = f"scope={scope} docs_by_org={json.dumps(by_org, ensure_ascii=False)} excluded_by_reason={json.dumps(by_reason)}"
          print(f"::notice title=admrul::{line}")
          print(f"::notice title=admrul 범위::{scope_line}")
          if titles:
              print(f"::notice title=admrul 시행 전 제외::{'; '.join(titles)}")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write(f"### 행정규칙 수집\n\n`{line}`\n\n`{scope_line}`\n")
                  if titles:
                      f.write(f"\n시행 전이라 이번 게시에서 뺀 규칙 {len(pend)}건(현행판 함께 수집 {paired}건, 옛 판 빠짐 {dropped}건):\n\n")
                      f.write(''.join(f"- {t}\n" for t in titles))
                      if len(pend) > len(titles):
                          f.write(f"- 외 {len(pend) - len(titles)}건(manifest 참고)\n")
          PY
