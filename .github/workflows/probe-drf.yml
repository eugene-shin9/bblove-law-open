name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: Failure samples (public data)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/fail.py" <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          import bblove_precedent_collect as m
          from bblove_law_all import Client, today
          from bblove_v107_pilot import records, text
          def short(v):
              return str(v).replace('\n', ' ')[:60]
          def main():
              oc = os.environ['LAW_OC']; d = today()
              c = Client(oc, seconds=900, interval=1.0)
              bad = []
              for extra, page in (({}, 1), ({'datSrcNm': '국세법령정보시스템'}, 250)):
                  doc, _ = c.get('lawSearch.do', dict(target='prec', display=100, page=page, **extra))
                  root = [v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v][0]
                  for r in records(m.catalog_rows(root, 'prec')):
                      try:
                          m.listed({k: r[k] for k in m.FIELDS['prec'] if k in r}, 'prec')
                      except ValueError as e:
                          if str(e) == 'CASE_OR_COURT_INVALID':
                              bad.append({k: short(r.get(k)) for k in ('사건번호', '법원명', '데이터출처명', '사건명')})
              print('::notice title=fail prec::' + json.dumps(bad[:8], ensure_ascii=False))
              doc, _ = c.get('lawSearch.do', dict(target='ttSpecialDecc', display=100, page=1))
              root = [v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v][0]
              rows = records(m.catalog_rows(root, 'ttSpecialDecc'))[:12]
              out = []
              for r in rows:
                  sid = text(r, '특별행정심판재결례일련번호')
                  ddoc, _ = c.get('lawService.do', dict(target='ttSpecialDecc', ID=sid))
                  svc = next((v for v in ddoc.values() if isinstance(v, dict)), ddoc)
                  out.append({'id': sid, 'list_date': text(r, '의결일자'), 'list_title': short(r.get('사건명')),
                              'detail': {k: short(svc.get(k)) for k in ('Law', '사건명', '의결일자', '특별행정심판재결례일련번호', '청구번호', '재결요지', '주문') if k in svc}})
              for i in range(0, len(out), 4):
                  print('::notice title=fail tt ' + str(i) + '::' + json.dumps(out[i:i+4], ensure_ascii=False).replace(oc, '***'))
          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/fail.py"
