name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: Fixed collector dry run per target (page 1 catalog, 3 details; codes only)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/dry2.py" <<'PY'
          import json, os, sys, traceback
          from collections import Counter
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          import bblove_precedent_collect as m
          from bblove_law_all import Client, today
          from bblove_v107_pilot import records
          from bblove_storage import strict_json
          def main():
              oc = os.environ['LAW_OC']; d = today()
              c = Client(oc, seconds=600, interval=1.0)
              for target in m.TARGETS:
                  res = {'target': target}
                  try:
                      doc, _ = c.get('lawSearch.do', dict(target=target, display=100, page=1))
                      root = [v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v][0]
                      rows = [{k: r[k] for k in m.FIELDS[target] if k in r} for r in records(m.catalog_rows(root, target))]
                      res['rows'] = len(rows)
                      res['fields_missing'] = sorted({k for k in m.FIELDS[target]} - set().union(*[set(r) for r in rows]))[:12]
                      codes = Counter()
                      for r in rows:
                          try:
                              m.normalize(r, target, d, allow_future=True); codes['OK'] += 1
                          except Exception as e:
                              codes[str(e) if str(e) in m.ERROR_CODES else type(e).__name__] += 1
                      res['catalog'] = dict(codes)
                      det = Counter()
                      for r in rows[:3]:
                          sid = m.identifier(r, target)
                          try:
                              ddoc, raw = c.get('lawService.do', dict(target=target, ID=sid), original=True)
                              if target == 'ntsCgmExpc' and (ddoc == {} or ddoc == {'NtsCgmExpcService': {}}):
                                  raw = json.dumps(r, ensure_ascii=False).encode(); lo = True
                              else:
                                  lo = False
                              raw = m.summary_bytes(raw, target)
                              m.validated(r, strict_json(raw), target, d, lo); det['OK' + ('_listing_only' if lo else '')] += 1
                          except Exception as e:
                              fr = [f'{os.path.basename(f.filename)}:{f.lineno}' for f in traceback.extract_tb(e.__traceback__)][-2:]
                              det[(str(e) if str(e) in m.ERROR_CODES else type(e).__name__) + '@' + ','.join(fr)] += 1
                      res['details'] = dict(det)
                  except Exception as e:
                      res['error'] = type(e).__name__
                  out = json.dumps(res, ensure_ascii=False)
                  print(f'::notice title=dry2 {target}::' + ('REDACTED' if oc in out else out))
          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/dry2.py"
