name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: Detail variants and source filters (public data; credential masked)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/var.py" <<'PY'
          import json, os, sys, time
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport
          def emit(oc, title, obj):
              out = json.dumps(obj, ensure_ascii=False).replace(oc, '***')
              print(f'::notice title={title}::' + out[:3800])
          def raw(oc, ep, params):
              time.sleep(1.0)
              c = BoundedClient(oc, measured_transport, request_limit=1)
              try:
                  body, rec = c.get(ep, params, label='var')
              except PilotBlocked as e:
                  rec = c.receipts[-1] if c.receipts else {}
                  return {'error': str(e)[:50], 'http': rec.get('http_status'), 'type': rec.get('content_type'), 'bytes': rec.get('bytes')}
              txt = body.decode('utf-8', 'replace')
              return {'http': rec.get('http_status'), 'type': rec.get('content_type'), 'bytes': len(body), 'head': txt[:300].replace('\n', ' ')}
          def main():
              oc = os.environ['LAW_OC']
              for name, ep, params in [
                  ('prec detail JSON tax-source', 'lawService.do', dict(target='prec', ID='613735', type='JSON')),
                  ('prec detail XML tax-source', 'lawService.do', dict(target='prec', ID='613735', type='XML')),
                  ('prec detail HTML tax-source', 'lawService.do', dict(target='prec', ID='625045', type='HTML')),
                  ('prec detail JSON court-source', 'lawService.do', dict(target='prec', ID='172077', type='JSON')),
                  ('prec list datSrcNm=대법원', 'lawSearch.do', dict(target='prec', datSrcNm='대법원', display=1, type='JSON')),
                  ('prec list datSrcNm=국세법령정보시스템', 'lawSearch.do', dict(target='prec', datSrcNm='국세법령정보시스템', display=1, type='JSON')),
                  ('prec list org=400201', 'lawSearch.do', dict(target='prec', org='400201', display=1, type='JSON')),
                  ('nts detail JSON', 'lawService.do', dict(target='ntsCgmExpc', ID='196750', type='JSON')),
                  ('nts detail XML', 'lawService.do', dict(target='ntsCgmExpc', ID='196750', type='XML')),
                  ('tribunal detail JSON old', 'lawService.do', dict(target='ttSpecialDecc', ID='2079565', type='JSON')),
                  ('tribunal list page 2', 'lawSearch.do', dict(target='ttSpecialDecc', display=5, page=500, type='JSON')),
                  ]:
                  emit(oc, 'var ' + name, raw(oc, ep, params))
          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/var.py"
