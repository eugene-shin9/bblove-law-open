name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: New collector entry pipeline on live samples (codes and counts only)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/live.py" <<'PY'
          import json, os, sys, tempfile, traceback
          from collections import Counter
          from pathlib import Path
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          import bblove_precedent_collect as m
          from bblove_law_all import Client, today
          from bblove_v107_pilot import records, sanitized, text
          from bblove_storage import strict_json
          def main():
              oc = os.environ['LAW_OC']; d = today()
              c = Client(oc, seconds=1500, interval=1.0)
              out = Path(tempfile.mkdtemp())
              sets = [('prec', {}, 1), ('prec', {'datSrcNm': '대법원'}, 1), ('prec', {'datSrcNm': '대법원'}, 400),
                      ('prec', {'datSrcNm': '국세법령정보시스템'}, 250), ('ntsCgmExpc', {}, 1),
                      ('ttSpecialDecc', {}, 1), ('ttSpecialDecc', {}, 1400)]
              for target, extra, page in sets:
                  res = {'set': f'{target} {extra} p{page}'}
                  try:
                      doc, _ = c.get('lawSearch.do', dict(target=target, display=100, page=page, **extra))
                      root = [v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v][0]
                      rows = [{k: r[k] for k in m.FIELDS[target] if k in r} for r in records(m.catalog_rows(root, target))]
                      _, raw = sanitized({'rows': rows, 'totalCnt': 0}, oc)
                      rows = strict_json(raw)['rows']
                      kinds, codes, details = Counter(), Counter(), 0
                      for r in rows:
                          e = dict(target=target, id=m.identifier(r, target), row=r, kind=m.default_kind(r, target))
                          kinds[e['kind']] += 1
                          if e['kind'] == 'skipped':
                              continue
                          if e['kind'] == 'detail':
                              if details >= 12:
                                  continue
                              details += 1
                          try:
                              raw = m.store_entry(c, out, e, d)
                              m.validated(e['row'], strict_json(raw), target, e['kind'])
                              codes['OK_' + e['kind']] += 1
                          except Exception as exc:
                              fr = [f'{os.path.basename(f.filename)}:{f.lineno}' for f in traceback.extract_tb(exc.__traceback__)][-1:]
                              codes[(str(exc) if str(exc) in m.ERROR_CODES else type(exc).__name__ + '@' + ','.join(fr))] += 1
                      res.update(rows=len(rows), kinds=dict(kinds), results=dict(codes))
                  except Exception as exc:
                      res['error'] = type(exc).__name__ + ':' + (str(exc) if str(exc) in m.ERROR_CODES else '')
                  print('::notice title=live ' + res['set'] + '::' + json.dumps(res, ensure_ascii=False).replace(oc, '***'))
          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/live.py"
