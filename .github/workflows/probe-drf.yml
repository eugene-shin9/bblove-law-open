name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: Source split statistics (public data)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/stat.py" <<'PY'
          import json, os, re, sys
          from collections import Counter
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_law_all import Client
          from bblove_v107_pilot import records, text
          def emit(oc, title, obj):
              print(f'::notice title={title}::' + json.dumps(obj, ensure_ascii=False).replace(oc, '***')[:3800])
          def main():
              oc = os.environ['LAW_OC']
              c = Client(oc, seconds=900, interval=1.0)
              def lst(**p):
                  doc, _ = c.get('lawSearch.do', p)
                  root = [v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v][0]
                  rows = next((records(v) for k, v in root.items() if isinstance(v, (list, dict))), [])
                  return int(text(root, 'totalCnt')), rows
              for src in ('대법원', '국세법령정보시스템', '근로복지공단산재판례'):
                  total, rows = lst(target='prec', datSrcNm=src, display=100, page=1)
                  emit(oc, 'stat prec ' + src, {'total': total, 'rows': len(rows),
                      'court_nonempty': sum(bool(text(r, '법원명')) for r in rows),
                      'courts': dict(Counter(text(r, '법원명') for r in rows).most_common(5)),
                      'caseno_samples': [text(r, '사건번호') for r in rows[:5]],
                      'caseno_pattern_ok': sum(bool(re.search(r'\d{2,4}[가-힣]+\s*\d+', text(r, '사건번호'))) for r in rows),
                      'sources': dict(Counter(text(r, '데이터출처명') for r in rows)),
                      'dates': [text(r, '선고일자') for r in rows[:3]]})
                  if src == '대법원' and rows:
                      sid = text(rows[0], '판례일련번호')
                      doc, _ = c.get('lawService.do', dict(target='prec', ID=sid))
                      svc = next((v for v in doc.values() if isinstance(v, dict)), {})
                      emit(oc, 'stat prec court detail', {'id': sid, 'keys': sorted(svc)[:30],
                           'has_summary': bool(text(svc, '판시사항') or text(svc, '판결요지')), 'court': text(svc, '법원명'), 'caseno': text(svc, '사건번호')})
              total, rows = lst(target='prec', display=1, page=1)
              emit(oc, 'stat prec all', {'total': total})
              for page in (1, 700, 1400):
                  total, rows = lst(target='ttSpecialDecc', display=100, page=page)
                  emit(oc, f'stat tribunal p{page}', {'total': total, 'rows': len(rows), 'title_nonempty': sum(bool(text(r, '사건명')) for r in rows),
                       'number_samples': [text(r, '청구번호') for r in rows[:4]], 'kinds': dict(Counter(text(r, '재결구분명') for r in rows)),
                       'number_ok': sum(bool(re.fullmatch(r'[가-힣]*\d{2,4}[가-힣]+\d+', re.sub(r'\s', '', text(r, '청구번호')))) for r in rows)})
              for page in (1, 600, 1300):
                  total, rows = lst(target='ntsCgmExpc', display=100, page=page)
                  emit(oc, f'stat nts p{page}', {'total': total, 'rows': len(rows), 'date_ok': sum(bool(re.fullmatch(r'\d{4}\.\d{2}\.\d{2}', text(r, '해석일자'))) for r in rows),
                       'date_samples': [text(r, '해석일자') for r in rows[:3]], 'link_hosts': dict(Counter(re.sub(r'^https?://([^/]+).*', r'\1', text(r, '법령해석상세링크')) for r in rows)),
                       'number_empty': sum(not text(r, '안건번호') for r in rows), 'orgs': dict(Counter(text(r, '해석기관명') for r in rows))})
          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/stat.py"
