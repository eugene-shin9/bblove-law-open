name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: List future-dated rows on the first 3 catalog pages per target (public case numbers and dates only)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/future.py" <<'PY'
          import json, os, re, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_law_all import Client, today
          from bblove_v107_pilot import records, text
          oc = os.environ['LAW_OC']; t = today()
          c = Client(oc, seconds=600, interval=1.0)
          keys = {'prec': ('선고일자', '사건번호', '법원명', '판례일련번호'), 'ntsCgmExpc': ('회신일자', '해석일자', '생산일자', '안건번호', '법령해석례일련번호'),
                  'ttSpecialDecc': ('의결일자', '청구번호', '특별행정심판재결례일련번호')}
          import traceback
          for target, ks in keys.items():
            try:
              hits, n = [], 0
              for page in (1, 2, 3):
                  doc, _ = c.get('lawSearch.do', dict(target=target, display=100, page=page))
                  root = next(v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v)
                  lk = [k for k, v in root.items() if isinstance(v, (list, dict))]
                  rows = records(root[lk[0]]) if lk else []
                  n += len(rows)
                  for r in rows:
                      day = re.sub(r'\D', '', text(r, *ks[:1]) if target != 'ntsCgmExpc' else text(r, '회신일자', '해석일자', '생산일자'))
                      if len(day) == 8 and day > t:
                          hits.append({k: text(r, k) for k in ks if text(r, k)})
              out = json.dumps({'target': target, 'today': t, 'rows': n, 'future': hits[:10], 'future_count': len(hits)}, ensure_ascii=False)
              print(f'::notice title=future {target}::' + ('REDACTED' if oc in out else out))
            except Exception as e:
              fr = [f'{os.path.basename(f.filename)}:{f.lineno}' for f in traceback.extract_tb(e.__traceback__)]
              print(f'::notice title=future {target} error::' + json.dumps({'exc': type(e).__name__, 'frames': fr[-4:]}))
          PY
          python3 "$RUNNER_TEMP/future.py"
