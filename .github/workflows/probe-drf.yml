name: Probe DRF targets (temporary diagnostics)
on:
  push:
    branches: [claude/probe-drf]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: One list request per target; print only status codes, content type and JSON root keys
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, os, sys
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport

          def main():
              oc = os.environ['LAW_OC']
              for target in ('law', 'eflaw', 'prec', 'ntsCgmExpc', 'ttSpecialDecc'):
                  c = BoundedClient(oc, measured_transport, request_limit=1)
                  keys, err = None, None
                  try:
                      doc, raw, _ = c.json('lawSearch.do', {'target': target, 'display': 1, 'page': 1}, 'probe ' + target)
                      root = next((v for v in doc.values() if isinstance(v, dict)), {})
                      keys = {'root': sorted(doc)[:3], 'totalCnt': root.get('totalCnt'), 'fields': sorted(root)[:8]}
                  except PilotBlocked as exc:
                      err = str(exc)
                  r = c.receipts[-1] if c.receipts else {}
                  msg = json.dumps({'target': target, 'status': r.get('status'), 'http': r.get('http_status'),
                                    'type': r.get('content_type'), 'bytes': r.get('bytes'), 'exc': r.get('exception_type'),
                                    'reason': r.get('reason_type'), 'error': err, 'json': keys}, ensure_ascii=False)
                  if oc in msg:
                      msg = 'REDACTED'
                  print(f'::notice title=probe {target}::{msg}')

          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/probe.py"
      - name: Live schema samples (public catalog/detail field names and short values)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          cat > "$RUNNER_TEMP/schema.py" <<'PY'
          import json, os, sys
          from collections import Counter
          sys.path[:0] = [os.path.join(os.environ['GITHUB_WORKSPACE'], 'src')]
          import bblove_precedent_collect as m
          from bblove_tax_p2_collect import BoundedClient, PilotBlocked
          from bblove_law_transport import measured_transport
          from bblove_v107_pilot import records
          def short(v):
              if isinstance(v, (dict, list)):
                  return {'type': type(v).__name__, 'keys': sorted(v)[:12] if isinstance(v, dict) else len(v)}
              s = str(v).replace('\n', ' ')
              return s[:70]
          def emit(oc, title, obj):
              out = json.dumps(obj, ensure_ascii=False).replace(oc, '***')
              for i in range(0, len(out), 3500):
                  print(f'::notice title={title} {i//3500}::' + out[i:i+3500])
          C = {}
          def get(oc, ep, params):
              c = C.setdefault('c', __import__('bblove_law_all').Client(oc, seconds=900, interval=1.0))
              try:
                  doc, _ = c.get(ep, params)
              except Exception as e:
                  return None, {'error': str(e)[:60] if str(e).isupper() or '_' in str(e) else type(e).__name__}
              return doc, None
          def walk(o, path=''):
              if isinstance(o, dict):
                  yield path, o
                  for k, v in o.items():
                      yield from walk(v, path + '/' + k)
              elif isinstance(o, list):
                  for i, v in enumerate(o[:1]):
                      yield from walk(v, path + '[0]')
          def main():
              oc = os.environ['LAW_OC']
              for target in m.TARGETS:
                  doc, err = get(oc, 'lawSearch.do', dict(target=target, display=100, page=1))
                  if err:
                      emit(oc, 'schema ' + target + ' list error', err); continue
                  root = [v for v in doc.values() if isinstance(v, dict) and 'totalCnt' in v][0]
                  rows = records(m.catalog_rows(root, target))
                  keys = Counter(k for r in rows for k in r)
                  src = Counter(str(r.get('데이터출처명')) for r in rows)
                  emit(oc, 'schema ' + target + ' list', {'keycount': dict(keys), 'sources': dict(src),
                       'samples': [{k: short(v) for k, v in r.items()} for r in rows[:3]]})
                  for r in rows[:2]:
                      ids = {k: r[k] for k in r if '일련번호' in k or k == 'id'}
                      sid = next(iter(ids.values()), None)
                      ddoc, derr = get(oc, 'lawService.do', dict(target=target, ID=sid))
                      info = {'ids': ids, 'link': short(next((v for k, v in r.items() if '링크' in k), ''))}
                      if derr:
                          info['detail_error'] = derr
                      else:
                          info['detail'] = [{'path': p, 'fields': {k: short(v) for k, v in o.items()}} for p, o in walk(ddoc)][:4]
                      emit(oc, 'schema ' + target + ' detail', info)
          if __name__ == '__main__':
              main()
          PY
          python3 "$RUNNER_TEMP/schema.py"
