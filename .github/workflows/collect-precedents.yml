name: Collect precedent, NTS interpretation and tax-tribunal summaries (law.go.kr DRF)
on:
  workflow_dispatch:
  schedule:
    # 매일 22:40 KST (13:40 UTC). GitHub 예약은 3~6시간씩 늦게 시작하므로(10/27~11/3 실측 22:25~01:31 UTC 시작)
    # 당겨 둔다: 6.5시간 늦어도 05:10 KST 시작, 5시간 예산이면 10:10 KST 전 종료 → 비공개 D1(10:07 KST+지연) 전.
    # 끝까지 받을 때까지 이어서 수집, 완료 후 매일 신규분 확인.
    - cron: '40 13 * * *'
permissions: {}
concurrency:
  # 법제처 호출이 겹치지 않도록 현행 법령 수집과 같은 그룹을 쓴다.
  group: law-go-kr-drf
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the YAML parser the workflow-contract tests use (pinned)
        run: python -m pip install --disable-pip-version-check -q PyYAML==6.0.3
      - name: Offline tests and public-content guard before using credentials
        run: |
          python -I -m unittest discover -s tests
          python -I scripts/repo_guard.py
      - name: Check the credential is configured (value is never printed)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: |
          if [ -z "$LAW_OC" ]; then
            echo "::error title=LAW_OC missing::Repository Actions secret LAW_OC is not available to this workflow"
            exit 1
          fi
          echo "::notice title=LAW_OC::configured"
      - name: Restore resumable collection
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: auto/precedent-collection
          key: precedent-summary-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            precedent-summary-v2-
      - name: Restore fulltext manifest only
        id: ft_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: auto/fulltext-collection/fulltext-manifest.json
          key: fulltext-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fulltext-v2-
      - name: Recover attested fulltext manifest when cache is absent
        id: ft_recover
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/fulltext_release.py recover
      - name: Restore committee checkpoint
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: auto/committee-collection
          key: committee-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            committee-v1-
      - name: Choose law.go.kr egress and check it answers (fails fast when blocked)
        id: egress
        uses: ./.github/actions/law-egress
        with:
          client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          exit-node: ${{ secrets.TS_EXIT_NODE }}
      - name: Collect (up to 5 hours; resumes next run)
        id: collect
        timeout-minutes: 320
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          FULLTEXT_READY: ${{ steps.ft_recover.outcome }}
          # Only this step goes through the exit node; empty means direct.
          HTTPS_PROXY: ${{ steps.egress.outputs.https-proxy }}
        run: python scripts/collect_precedents.py --out auto/precedent-collection --scope all --seconds 18000 --committee --fulltext
      - name: Credential scan before caching or uploading anything
        id: scan_raw
        if: always()
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py auto/precedent-collection
      - name: Save checkpoint (only after a clean scan)
        if: always() && steps.scan_raw.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: auto/precedent-collection
          key: precedent-summary-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Which finished catalogs could be published early (no network, no copy)
        id: finished
        if: steps.collect.outcome == 'success' && steps.collect.outputs.complete != 'true'
        run: python -I scripts/collect_precedents.py --out auto/precedent-collection --finished-targets
      - name: Decide what to publish and whether it is already published
        id: tag
        if: steps.collect.outputs.complete == 'true' || steps.finished.outputs.partial_targets != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETE: ${{ steps.collect.outputs.complete }}
          PARTIAL: ${{ steps.finished.outputs.partial_targets }}
        run: |
          date=$(python3 -c "import json;print(json.load(open('auto/precedent-collection/manifest.json'))['date'])")
          if [ "$COMPLETE" = "true" ]; then
            publish=$(python3 -c "import json,sys;sys.path.insert(0,'scripts');from collect_precedents import should_publish;print(should_publish(json.load(open('auto/precedent-collection/manifest.json'))))")
            if [ "$publish" = "False" ]; then
              echo "::notice::INCREMENTAL_NO_NEW"
              exit 0
            fi
            tag="prec-${date}"; src="auto"; title="판례·국세청 해석·조세심판원 요지 수집본 ($tag)"
          else
            # Finished catalogs first (e.g. prec-20261030-partial-prec); the final prec-<date> supersedes them.
            # Compare with the union of all prior coverage, including complete releases.
            if ! publish=$(python3 scripts/collect_precedents.py --may-publish-partial "$PARTIAL"); then
              echo "::error::PARTIAL_RELEASE_HISTORY_FAILED"
              exit 1
            fi
            if [ "$publish" != "true" ]; then
              echo "::notice::PARTIAL_SUBSET_SKIPPED"
              exit 0
            fi
            tag="prec-${date}-partial-$(echo "$PARTIAL" | tr ',' '-')"; src="auto/precedent-export"
            title="요지 수집본 중간 게시 (부분: $PARTIAL) ($tag)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Export the finished catalogs (only when they are not published yet)
        id: export
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.exists == 'false' && steps.collect.outputs.complete != 'true'
        run: |
          python -I scripts/collect_precedents.py --out auto/precedent-collection --export-complete auto/precedent-export
          [ -f auto/precedent-export/precedent-collection/manifest.json ] || { echo "::error title=EXPORT_VERIFY_FAILED::partial export did not verify; nothing published"; exit 1; }
      - name: Package collection in parts under 2 GiB, with release-info
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.exists == 'false'
        run: |
          python -I scripts/package_precedents.py --source "${{ steps.tag.outputs.src }}/precedent-collection" --dest release --kind precedent-summary-raw
      - name: Credential scan of the release payload
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.exists == 'false'
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py release/precedent-manifest.json release/precedent-summary.json release/release-info.json "${{ steps.tag.outputs.src }}/precedent-collection"
      - name: Build provenance attestation
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.exists == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*
      - name: Publish an immutable release (draft until every file is uploaded)
        if: steps.tag.outputs.tag != '' && steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ steps.tag.outputs.title }}
        run: |
          python -I scripts/publish_precedents.py --directory release --tag "$TAG" --title "$TITLE" --commit "$GITHUB_SHA"
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Progress (annotation and Job Summary; nothing is committed)
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys, pathlib
          sys.path.insert(0, 'scripts')
          from collect_precedents import summary
          s = summary('auto/precedent-collection')
          a = pathlib.Path('auto/precedent-collection/attempt.json')
          att = json.loads(a.read_text()) if a.exists() else {}
          print(f"::notice title=precedents::outcome=${{ steps.collect.outputs.outcome }} {json.dumps(s, ensure_ascii=False)} attempt={att.get('status')}/{att.get('reason')}")
          PY
      - name: Scan committee cache
        id: committee_scan
        if: always() && steps.collect.outputs.committee_outcome != '' && steps.collect.outputs.committee_outcome != 'SKIPPED'
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py auto/committee-collection
      - name: Save committee checkpoint
        if: always() && steps.committee_scan.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: auto/committee-collection
          key: committee-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build gated committee projection
        id: committee_package
        if: always() && steps.committee_scan.outcome == 'success' && steps.collect.outputs.committee_complete == 'true'
        run: python -I scripts/committee_release.py --source auto/committee-collection --dest release-decc
      - name: Scan committee release
        id: committee_release_scan
        if: always() && steps.committee_scan.outcome == 'success' && steps.committee_package.outcome == 'success'
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py release-decc
      - name: Compare last published committee manifest
        id: committee_publish
        if: always() && steps.committee_release_scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/committee_release.py --dest release-decc --decide
      - name: Attest committee release
        id: committee_attest
        if: always() && steps.committee_release_scan.outcome == 'success' && steps.committee_publish.outputs.needed == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-decc/*
      - name: Publish committee release
        if: always() && steps.committee_release_scan.outcome == 'success' && steps.committee_publish.outputs.needed == 'true' && steps.committee_attest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="decc-$(date -u +%Y%m%d)"
          python -I scripts/publish_precedents.py --directory release-decc --tag "$tag" --title "$tag" --commit "$GITHUB_SHA"
      - name: Scan fulltext delta source and manifest
        id: ft_scan
        if: always() && steps.collect.outputs.fulltext_delta != '' && steps.collect.outputs.fulltext_outcome != 'FAILED' && steps.collect.outputs.fulltext_outcome != 'HALTED' && steps.collect.outputs.fulltext_outcome != 'SKIPPED'
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python -I scripts/secret_scan.py auto/fulltext-delta auto/fulltext-collection/fulltext-manifest.json
      - name: Package fulltext delta
        id: ft_package
        if: always() && steps.ft_scan.outcome == 'success' && steps.collect.outputs.fulltext_delta != '0'
        run: python -I scripts/fulltext_release.py prepare
      - name: Attest fulltext delta
        id: ft_attest
        if: always() && steps.ft_package.outcome == 'success'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-fulltext/*
      - name: Publish fulltext delta
        id: ft_publish
        if: always() && steps.ft_attest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FULLTEXT_TAG: ${{ steps.ft_package.outputs.tag }}
        run: python -I scripts/publish_precedents.py --directory release-fulltext --tag "$FULLTEXT_TAG" --title "$FULLTEXT_TAG" --commit "$GITHUB_SHA"
      - name: Finalize fulltext publication state
        id: ft_finalize
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.ft_publish.outcome }}
          FULLTEXT_DELTA: ${{ steps.collect.outputs.fulltext_delta }}
          FULLTEXT_OUTCOME: ${{ steps.collect.outputs.fulltext_outcome }}
          FULLTEXT_TAG: ${{ steps.ft_package.outputs.tag }}
          SCAN_OUTCOME: ${{ steps.ft_scan.outcome }}
        run: python -I scripts/fulltext_release.py finalize
      - name: Save fulltext manifest after publication or no delta
        if: always() && (steps.ft_finalize.outputs.state == 'PUBLISHED' || steps.ft_finalize.outputs.state == 'NO_DELTA')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: auto/fulltext-collection/fulltext-manifest.json
          key: fulltext-v2-${{ github.run_id }}-${{ github.run_attempt }}
