name: Egress check (law.go.kr DRF reachability, manual)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: law-go-kr-drf
  cancel-in-progress: false
  # 기본값은 대기 1건뿐이라 새 실행이 대기 중인 실행을 취소한다(11/9 월요일 법령 수집이 수동 실행에 밀려 취소됨).
  # queue: max는 대기열(최대 100)에 차례로 쌓아 순서대로 실행한다. 동시에 1건만 도는 제한은 그대로다.
  queue: max
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Choose law.go.kr egress and check it answers (fails fast when blocked)
        id: egress
        uses: ./.github/actions/law-egress
        with:
          client-id: ${{ secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          exit-node: ${{ secrets.TS_EXIT_NODE }}
      - name: One credentialed list request per target (codes and JSON keys only)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          HTTPS_PROXY: ${{ steps.egress.outputs.https-proxy }}
        run: python -I scripts/egress_check.py
